# The type-checking gate (D-209; docs/dashboard_design/04_architecture.md §4,
# docs/dashboard_design/12_testing_strategy.md §12, docs/dashboard_design/13_phased_build_plan.md §13 phase 2a):
# mypy --strict over the security-relevant Python code. `files` below IS the strict
# module list, the only one: it only grows (each phase adds the security-relevant
# modules it creates or touches, so the full list of §4 is strict by gate 8a). Modules
# outside it are read only where a strict module imports them, and their own errors are
# not reported (follow_imports = silent): they adopt typing gradually.
# A `# type: ignore[code]` needs a reason on the same line (test_typing.py checks it).
#
# Run from the repo root:  .venv/bin/python -m mypy
# Enforced by test_typing.py and .githooks/pre-commit; mypy is pinned in requirements-dev.txt.
[mypy]
python_version = 3.12
strict = True
enable_error_code = ignore-without-code
files = actions.py, store.py, backup.py, driven.py, names.py, mcp_server.py, schedule.py, fillup.py, stage_eta.py, telemetry.py, runner_state.py, project_docs.py, failstop.py, compact_timing.py, inbox.py, inbox_api.py, change_manifest.py, nightly_tasks.py, runner.py, runner_jobs.py, manager_launch.py, remote_control.py, decisions.py, prompts.py, dashboard/__init__.py, dashboard/api_types.py, dashboard/errors.py, dashboard/security.py, dashboard/routes.py, dashboard/app.py, dashboard/codegen.py, dashboard/auth/__init__.py, dashboard/auth/passwords.py, dashboard/auth/totp.py, dashboard/auth/recovery.py, dashboard/auth/factors.py, dashboard/auth/ratelimit.py, dashboard/auth/mds.py, dashboard/auth/passkeys.py, dashboard/markdown.py, dashboard/auth/oidc.py, dashboard/auth/oidc_groups.py, dashboard/sessions.py, dashboard/setup.py
follow_imports = silent
cache_dir = .mypy_cache

# Authlib ships no py.typed (docs/phase6b_plan.md §0): only dashboard/auth/oidc.py imports it, and
# every value it takes from Authlib is converted to a typed one there.
[mypy-authlib.*]
ignore_missing_imports = True
