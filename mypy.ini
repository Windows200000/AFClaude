# The type-checking gate (D-209; docs/dashboard_design.md §4, §12, §13 phase 2a):
# mypy --strict over the security-relevant Python code. `files` below IS the strict
# module list, the only one: it only grows (each phase adds the security-relevant
# modules it creates or touches, so the full list of §4 is strict by gate 8a). Modules
# outside it are read only where a strict module imports them, and their own errors are
# not reported (follow_imports = silent): they adopt typing gradually.
# A `# type: ignore[code]` needs a reason on the same line (test_typing.py checks it).
#
# Run from the repo root:  .venv/bin/python -m mypy
# Enforced by test_typing.py and .githooks/pre-commit; mypy is pinned in requirements-dev.txt.
[mypy]
python_version = 3.12
strict = True
enable_error_code = ignore-without-code
files = actions.py, store.py, mcp_server.py, schedule.py
follow_imports = silent
cache_dir = .mypy_cache
