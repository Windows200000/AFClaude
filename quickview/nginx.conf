# AFClaude quickview (ovm1). Deny by default: no valid X-AFClaude-Key header -> 401.
# Read-only, except /afclaude/api/ (the message box to the task-manager, inbox_api.py).
map $http_x_afclaude_key $afc_key_ok {
    default 0;
    include /etc/nginx/afclaude-keymap.conf;   # one line: "<key>" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;
    autoindex off;

    if ($afc_key_ok = 0) {
        return 401;
    }

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /afclaude/ {
        limit_except GET HEAD { deny all; }
        alias /srv/quickview/;
        index status.json;
        types {
            application/json json;
            text/markdown md;
            text/html html;   # the page itself (D-253), ovm3 proxies /private/AFClaude.html to it
            text/javascript js;   # the owner preview build's bundle (D-211, tools/build_preview.py)
            text/css css;         # -- X-Content-Type-Options: nosniff above needs the real type, or the
                                  # browser refuses to run/apply a file served as default_type text/plain
        }
        default_type text/plain;
        charset utf-8;
        charset_types application/json text/markdown text/plain text/html;
    }

    # The owner's message box (D-178/D-241): the only write path, to inbox_api.py on a unix socket in
    # the afclaude container (data/api/, mounted read-only here). The key check above covers it, and
    # the API checks the same key again.
    location /afclaude/api/ {
        limit_except GET POST { deny all; }
        client_max_body_size 16k;
        proxy_pass http://unix:/run/afclaude-api/inbox.sock;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
