# AFClaude quickview (ovm1). Deny by default: no valid X-AFClaude-Key header -> 401.
map $http_x_afclaude_key $afc_key_ok {
    default 0;
    include /etc/nginx/afclaude-keymap.conf;   # one line: "<key>" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;
    autoindex off;

    if ($afc_key_ok = 0) {
        return 401;
    }

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /afclaude/ {
        limit_except GET HEAD { deny all; }
        alias /srv/quickview/;
        index status.json;
        types {
            application/json json;
            text/markdown md;
        }
        default_type text/plain;
        charset utf-8;
        charset_types application/json text/markdown text/plain;
    }

    location / {
        return 404;
    }
}
