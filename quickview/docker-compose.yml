# AFClaude quickview: a tiny read-only nginx behind the host's existing Traefik.
# Serves ONLY ../data/quickview (written by export_quickview.py) at https://$AFCLAUDE_QUICKVIEW_HOST/afclaude/,
# and every request needs the X-AFClaude-Key header (401 otherwise).
# The host name comes from quickview/.env (gitignored): AFCLAUDE_QUICKVIEW_HOST=<your host>.
# The key lives outside the repo: ~/.config/afclaude/quickview-nginx-keymap.conf (mode 600).
name: afclaude-quickview
services:
  quickview:
    image: nginx:alpine
    container_name: afclaude-quickview
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${HOME}/.config/afclaude/quickview-nginx-keymap.conf:/etc/nginx/afclaude-keymap.conf:ro
      - ../data/quickview:/srv/quickview:ro
    expose:
      - "80"
    mem_limit: 64m
    networks:
      - traefik_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_default"
      - "traefik.http.routers.afclaude-quickview.rule=Host(`${AFCLAUDE_QUICKVIEW_HOST:?set AFCLAUDE_QUICKVIEW_HOST in quickview/.env}`) && PathPrefix(`/afclaude`)"
      - "traefik.http.routers.afclaude-quickview.entrypoints=websecure"
      - "traefik.http.routers.afclaude-quickview.tls.certresolver=letsencrypt"
      - "traefik.http.services.afclaude-quickview.loadbalancer.server.port=80"

networks:
  traefik_default:
    external: true
