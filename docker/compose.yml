# AFClaude manager container. Machine-specific values: docker/.env (gitignored),
# see docker/env.example. Start (from the repo root; the hash is baked into the image as
# its code version, not set in docker/.env where it would go stale):
#   AFCLAUDE_CODE_VERSION=$(git rev-parse --short HEAD) docker compose -f docker/compose.yml up -d --build
# No docker socket, no privileges, no published ports.
name: afclaude
services:
  afclaude:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        AFCLAUDE_DIR: ${AFCLAUDE_DIR:?set in docker/.env}
        AFCLAUDE_CODE_VERSION: ${AFCLAUDE_CODE_VERSION:-}   # git commit, from the Start line
    image: afclaude-manager:latest
    container_name: afclaude
    restart: unless-stopped
    # a `docker stop` reaches the runner through the entrypoint (runner.py stop): its running runs get
    # up to 80 s (runner.STOP_GRACE) to end before it records its clean exit (phase 3a S2)
    stop_grace_period: 90s
    # phase 3a S8 (AFCLAUDE_SCHEDULER on/runner): a live runner with a loop heartbeat under 3 min; the
    # legacy and off modes are always healthy. It only reports (docker ps); a stuck loop is ended by the
    # runner's own watchdog thread (exit 70) and `restart: unless-stopped` starts the container again.
    healthcheck:
      test: ["CMD", "python3", "runner.py", "health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    environment:
      AFCLAUDE_SCHEDULER: ${AFCLAUDE_SCHEDULER:-off}
      AFCLAUDE_MANAGER_SESSION: ${AFCLAUDE_MANAGER_SESSION:?set in docker/.env}
      DISPATCHER_MANAGER_SESSION: ${AFCLAUDE_MANAGER_SESSION}
      QUICKVIEW_SELF_SESSION: ${AFCLAUDE_MANAGER_SESSION}
      AFCLAUDE_BRIDGE_HOST: ${AFCLAUDE_BRIDGE_HOST:-host.docker.internal}
      AFCLAUDE_BRIDGE_USER: ${AFCLAUDE_BRIDGE_USER:?set in docker/.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${AFCLAUDE_HOST_REPO:?}:/host/repo:ro                       # local-only files, read fresh
      - ${AFCLAUDE_HOST_REPO}/data:${AFCLAUDE_DIR}/data             # DB, samples, state, logs (rw)
      - ${HOST_HOME:?}/.claude/projects:/home/opc/.claude/projects:ro
      - ${HOST_HOME}/.claude/sessions:/home/opc/.claude/sessions:ro
      - ${AFCLAUDE_HOST_REPO}/docker/secrets/host_bridge_ed25519:/run/secrets/host_bridge_ed25519:ro
      - /etc/ssh/ssh_host_ed25519_key.pub:/run/host_ssh/ssh_host_ed25519_key.pub:ro
      # the quickview key: inbox_api.py checks it on every request too (D-150/D-241)
      - ${HOST_HOME}/.config/afclaude/quickview.key:/run/secrets/afclaude_quickview.key:ro
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777          # exec: the unit tests put stub binaries in temp dirs
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [afclaude]
networks:
  afclaude:
    # host_exec.py's authorized_keys line only accepts from="172.16.0.0/12"
    ipam:
      config:
        - subnet: ${AFCLAUDE_SUBNET:-172.28.0.0/24}
